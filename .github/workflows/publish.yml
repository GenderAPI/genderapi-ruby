name: Publish to RubyGems

# Runs when a version tag such as v2.0.0 is pushed.
# Authenticates through the RubyGems trusted publisher for GenderAPI/genderapi-ruby
# (publish.yml) using OIDC; no API key is stored.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Test
        run: bundle exec rake test
      - name: Check tag matches GenderAPI::VERSION
        run: |
          version="$(ruby -Ilib -e 'require "genderapi/version"; print GenderAPI::VERSION')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi
      - name: Build gem
        run: gem build genderapi.gemspec
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Push to RubyGems
        run: gem push "genderapi-${GITHUB_REF_NAME#v}.gem"
